  <label>Ngành trúng tuyển *</label>
  <select id="nganh" required>

    <option value="Kỹ thuật y sinh">Kỹ thuật y sinh</option>
    <option value="Kỹ thuật phục hồi chức năng">Kỹ thuật phục hồi chức năng</option>
    <option value="Kỹ thuật xét nghiệm y học">Kỹ thuật xét nghiệm y học</option>
    <option value="Kỹ thuật hình ảnh y học">Kỹ thuật hình ảnh y học</option>
    <option value="Điều dưỡng">Điều dưỡng</option>
    <option value="Điều dưỡng (Tiếng Anh)">Điều dưỡng (Tiếng Anh)</option>
    <option value="Hộ sinh">Hộ sinh</option>
    <option value="Công nghệ thẩm mỹ">Công nghệ thẩm mỹ</option>
    <option value="Dinh dưỡng">Dinh dưỡng</option>
    <option value="Y tế công cộng">Y tế công cộng</option>
    <option value="Kỹ thuật phục hình răng (*)">Kỹ thuật phục hình răng (*)</option>
    <option value="Y học dự phòng (*)">Y học dự phòng (*)</option>
    <option value="Digital Marketing">Digital Marketing</option>

    <option value="Thương mại điện tử">Thương mại điện tử</option>
    <option value="Quản trị kinh doanh">Quản trị kinh doanh</option>

    <option value="Quản trị khách sạn">Quản trị khách sạn</option>
    <option value="Quản trị dịch vụ du lịch và lữ hành">Quản trị dịch vụ du lịch và lữ hành</option>
    <option value="Tài chính - Ngân hàng">Tài chính - Ngân hàng</option>

    <option value="Ngôn ngữ Nhật">Ngôn ngữ Nhật</option>

    <option value="Ngôn ngữ Hàn Quốc">Ngôn ngữ Hàn Quốc</option>
    <option value="Truyền thông đa phương tiện">Truyền thông đa phương tiện</option>
    <option value="Quan hệ công chúng">Quan hệ công chúng</option>

    <option value="Tâm lý học giáo dục">Tâm lý học giáo dục</option>
    <option value="Quản lý giáo dục">Quản lý giáo dục</option>

    <option value="Logistics và quản lý chuỗi cung ứng (Tiếng Anh)">Logistics và quản lý chuỗi cung ứng (Tiếng Anh)</option>

  <label>Số CCCD *</label>
  <input id="cccd" required maxlength="12" pattern="[0-9]{12}">

  <label>Số điện thoại *</label>
  <input id="sdt" required maxlength="11">

  <label>Email cá nhân *</label>
  <input id="email" type="email" required>

  <label>Họ tên phụ huynh/người giám hộ *</label>
  <input id="ph_hoten" required>

  <label>SĐT phụ huynh/người giám hộ *</label>
  <input id="ph_sdt" required maxlength="11">

  <button type="submit" id="submitBtn">Gửi đăng ký</button>

<div id="msg" style="display:none"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyAkoch5dGeF12mUJpC5swPGaGCfkwUpywant4OYSBQwJGySPFfANWToV67AHvbi2_D/exec";
const API_KEY = "HIU-K2026-QuayTiepNhan-7Xk2m9";
var radios = document.querySelectorAll('input[name="nguoinop"]');
var nguoithanBox = document.getElementById("nguoithanBox");
var nguoithanInfo = document.getElementById("nguoithan_info");
var submitBtn = document.getElementById("submitBtn");

// Gửi request, nếu thất bại (mất mạng tạm thời) thì tự thử lại 1 lần sau 2 giây
function fetchWithRetry(url, options) {
  return fetch(url, options).catch(function () {
    return new Promise(function (resolve) {
      setTimeout(resolve, 2000);
    }).then(function () {
      return fetch(url, options);
    });
  });
}

function toggleNguoiThan() {
  var checked = document.querySelector('input[name="nguoinop"]:checked').value;
  if (checked === "nguoithan") {
    nguoithanBox.style.display = "block";
    nguoithanInfo.setAttribute("required", "required");
  } else {
    nguoithanBox.style.display = "none";
    nguoithanInfo.removeAttribute("required");
  }
}
radios.forEach(function (r) { r.addEventListener("change", toggleNguoiThan); });
toggleNguoiThan();

var mahosoInput = document.getElementById("mahoso");
mahosoInput.addEventListener("input", function () {
  var digits = mahosoInput.value.toUpperCase().replace(/^HIU/, "").replace(/[^0-9]/g, "");
  mahosoInput.value = "HIU" + digits;
});
mahosoInput.addEventListener("focus", function () {
  var v = mahosoInput.value;
  try {
    mahosoInput.setSelectionRange(v.length, v.length);
  } catch (err) {
    // Một số trình duyệt di động không hỗ trợ dòng này ở vài thời điểm - bỏ qua, không ảnh hưởng gì
  }
});

function showMsg(text, cls) {
  var msg = document.getElementById("msg");
  msg.style.display = "block";
  msg.className = cls;
  msg.textContent = text;
}

document.getElementById("f").addEventListener("submit", function (e) {
  e.preventDefault();

  var mahoso = document.getElementById("mahoso").value.trim();
  if (!/^HIU[0-9]+$/.test(mahoso)) {
    showMsg("Mã hồ sơ phải bắt đầu bằng HIU, theo sau là dãy số viết liền, không có khoảng trắng.", "err");
    return;
  }

  var nguoinop = document.querySelector('input[name="nguoinop"]:checked').value;
  var data = {
    nguoinop: nguoinop,
    nguoithan_info: nguoinop === "nguoithan" ? nguoithanInfo.value.trim() : "",
    mssv: document.getElementById("mssv").value.trim(),
    hoten: document.getElementById("hoten").value.trim(),
    mahoso: mahoso,
    nganh: document.getElementById("nganh").value.trim(),
    cccd: document.getElementById("cccd").value.trim(),
    sdt: document.getElementById("sdt").value.trim(),
    email: document.getElementById("email").value.trim(),
    ph_hoten: document.getElementById("ph_hoten").value.trim(),
    ph_sdt: document.getElementById("ph_sdt").value.trim(),
    key: API_KEY
  };

  submitBtn.disabled = true;
  submitBtn.textContent = "Đang gửi... vui lòng không tắt hoặc rời khỏi trang";
  showMsg("Đang gửi đăng ký, vui lòng đợi...", "warn");

  fetchWithRetry(API_URL + "?action=dangky_submit", {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(data)
  })
    .then(function (response) { return response.json(); })
    .then(function (res) {
      if (res.success) {
        showMsg("Sinh viên đăng ký thành công, đợi Quầy 1 gọi tên.", "ok");
        document.getElementById("f").reset();
        document.getElementById("mahoso").value = "HIU";
        toggleNguoiThan();
      } else {
        showMsg(res.message, "err");
      }
    })
    .catch(function (err) {
      showMsg("Không nhận được phản hồi từ hệ thống (có thể do mạng yếu). Hồ sơ CÓ THỂ đã được lưu - vui lòng báo CTV Quầy 1 kiểm tra MSSV " + data.mssv + " trước khi gửi lại, để tránh đăng ký trùng.", "err");
    })
    .finally(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = "Gửi đăng ký";
    });
});
</script>
