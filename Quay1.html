<style>
  body { font-family: Arial, sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 18px; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #666; margin-bottom: 12px; }
  input#filter, input#nhanvien { width: 100%; padding: 10px; font-size: 15px; box-sizing: border-box; margin-bottom: 10px; }
  .row { border: 1px solid #ddd; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .row .info { font-size: 14px; }
  .row .info b { font-size: 15px; }
  .row .muted { color: #888; font-size: 12px; }
  .row .actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  button.act { background: #1a73e8; color: #fff; border: none; border-radius: 4px; padding: 8px 12px; font-size: 13px; white-space: nowrap; }
  button.skip { background: none; color: #c5221f; border: 1px solid #c5221f; border-radius: 4px; padding: 6px 12px; font-size: 12px; white-space: nowrap; cursor: pointer; }
  #empty { color: #888; font-size: 14px; padding: 20px 0; text-align: center; }
  #msg { margin-bottom: 10px; padding: 10px; border-radius: 4px; font-size: 14px; display:none; }
  .ok { background: #e6f4ea; color: #137333; }
  .err { background: #fce8e6; color: #c5221f; }
  #count { font-weight: bold; }
</style>

<h2>Quầy 1 - Xác nhận đăng ký, mời qua Quầy 2</h2>
<div class="sub">Đang chờ xác nhận: <span id="count">0</span> sinh viên</div>

<input id="nhanvien" placeholder="Tên CTV phụ trách (điền 1 lần)">
<input id="filter" placeholder="Lọc theo MSSV hoặc tên...">
<div id="msg"></div>
<div id="list"></div>
<div id="empty" style="display:none">Không có sinh viên nào đang chờ.</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyAkoch5dGeF12mUJpC5swPGaGCfkwUpywant4OYSBQwJGySPFfANWToV67AHvbi2_D/exec";
const API_KEY = "HIU-K2026-QuayTiepNhan-7Xk2m9";
var currentQueue = [];

// Gửi request, nếu thất bại (mất mạng tạm thời) thì tự thử lại 1 lần sau 2 giây
function fetchWithRetry(url, options) {
  return fetch(url, options).catch(function () {
    return new Promise(function (resolve) {
      setTimeout(resolve, 2000);
    }).then(function () {
      return fetch(url, options);
    });
  });
}

function render() {
  var filter = document.getElementById('filter').value.trim().toLowerCase();
  var list = document.getElementById('list');
  var filtered = (currentQueue || []).filter(function (s) {
    if (!filter) return true;
    return (s.mssv + ' ' + s.hoten).toLowerCase().indexOf(filter) !== -1;
  });
  document.getElementById('count').textContent = currentQueue.length;
  document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';
  list.innerHTML = '';
  filtered.forEach(function (s) {
    var div = document.createElement('div');
    div.className = 'row';
    div.innerHTML =
      '<div class="info"><b>' + s.hoten + '</b><br>MSSV: ' + s.mssv +
      ' &middot; ' + (s.nganh || '') + '</div>';

    var actions = document.createElement('div');
    actions.className = 'actions';

    var btn = document.createElement('button');
    btn.className = 'act';
    btn.textContent = 'Xác nhận - mời qua Quầy 2';
    btn.onclick = function () { confirmStudent(s.mssv, btn); };
    actions.appendChild(btn);

    var skipBtn = document.createElement('button');
    skipBtn.className = 'skip';
    skipBtn.textContent = 'Bỏ qua';
    skipBtn.onclick = function () { skipStudent(s.mssv, s.hoten, skipBtn); };
    actions.appendChild(skipBtn);

    div.appendChild(actions);
    list.appendChild(div);
  });
}

function showMsg(text, ok) {
  var msg = document.getElementById('msg');
  msg.style.display = 'block';
  msg.className = ok ? 'ok' : 'err';
  msg.textContent = text;
  setTimeout(function () { msg.style.display = 'none'; }, 5000);
}

function confirmStudent(mssv, btn) {
  btn.disabled = true;
  btn.textContent = 'Đang xử lý...';
  var nhanvien = document.getElementById('nhanvien').value.trim();

  fetchWithRetry(API_URL + "?action=quay1_confirm", {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ mssv: mssv, nhanvien: nhanvien, key: API_KEY })
  })
    .then(function (response) { return response.json(); })
    .then(function (res) {
      showMsg(res.message, res.success);
      loadQueue();
    })
    .catch(function (err) {
      showMsg('Không nhận được phản hồi (mạng yếu). Hồ sơ có thể đã được xử lý - vui lòng tải lại trang để kiểm tra trước khi bấm lại.', false);
      btn.disabled = false;
      btn.textContent = 'Xác nhận - mời qua Quầy 2';
      loadQueue();
    });
}

function skipStudent(mssv, hoten, btn) {
  var confirmed = confirm('Bạn chắc chắn muốn bỏ qua sinh viên "' + hoten + '" (MSSV: ' + mssv + ')?\nHồ sơ sẽ không xuất hiện lại trong hàng đợi.');
  if (!confirmed) return;

  btn.disabled = true;
  btn.textContent = 'Đang xử lý...';
  var nhanvien = document.getElementById('nhanvien').value.trim();

  fetchWithRetry(API_URL + "?action=quay1_boqua", {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ mssv: mssv, nhanvien: nhanvien, key: API_KEY })
  })
    .then(function (response) { return response.json(); })
    .then(function (res) {
      showMsg(res.message, res.success);
      loadQueue();
    })
    .catch(function (err) {
      showMsg('Không nhận được phản hồi (mạng yếu). Hồ sơ có thể đã được xử lý - vui lòng tải lại trang để kiểm tra trước khi bấm lại.', false);
      btn.disabled = false;
      btn.textContent = 'Bỏ qua';
      loadQueue();
    });
}

function loadQueue() {
  fetchWithRetry(API_URL + "?action=layDanhSachQuay1&key=" + encodeURIComponent(API_KEY))
    .then(function (response) { return response.json(); })
    .then(function (res) {
      currentQueue = res || [];
      render();
    })
    .catch(function (err) {
      // Lỗi tải danh sách tạm thời (mạng chậm) - bỏ qua, lần làm mới tiếp theo (5 giây sau) sẽ tự thử lại
    });
}

document.getElementById('filter').addEventListener('input', render);

loadQueue();
setInterval(loadQueue, 5000); // tự làm mới mỗi 5 giây
</script>
