<style>
  body { font-family: Arial, sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 18px; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #666; margin-bottom: 12px; }
  input#filter, input#nhanvien { width: 100%; padding: 10px; font-size: 15px; box-sizing: border-box; margin-bottom: 10px; }
  .row { border: 1px solid #ddd; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
  .row .info { font-size: 14px; margin-bottom: 8px; }
  .row .info b { font-size: 15px; }
  .row .nguoinop { font-size: 12px; color: #444; background: #fff8e1; border-radius: 4px; padding: 4px 8px; display: inline-block; margin-bottom: 8px; }
  .row textarea.ghichu { width: 100%; padding: 8px; font-size: 13px; box-sizing: border-box; margin-bottom: 8px; font-family: Arial, sans-serif; resize: vertical; }
  button.act { background: #1a73e8; color: #fff; border: none; border-radius: 4px; padding: 8px 12px; font-size: 13px; width: 100%; }
  #empty { color: #888; font-size: 14px; padding: 20px 0; text-align: center; }
  #msg { margin-bottom: 10px; padding: 10px; border-radius: 4px; font-size: 14px; display:none; }
  .ok { background: #e6f4ea; color: #137333; }
  .err { background: #fce8e6; color: #c5221f; }
  #count { font-weight: bold; }
</style>

<h2>Quầy 3 - Chụp ảnh thẻ, trả biên nhận</h2>
<div class="sub">Đang chờ gọi tên: <span id="count">0</span> sinh viên</div>

<input id="nhanvien" placeholder="Tên CTV phụ trách (điền 1 lần)">
<input id="filter" placeholder="Lọc theo MSSV hoặc tên...">
<div id="msg"></div>
<div id="list"></div>
<div id="empty" style="display:none">Không có sinh viên nào đang chờ.</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyAkoch5dGeF12mUJpC5swPGaGCfkwUpywant4OYSBQwJGySPFfANWToV67AHvbi2_D/exec";
const API_KEY = "HIU-K2026-QuayTiepNhan-7Xk2m9";
var currentQueue = [];
var ghiChuStore = {};

function queueKey(q) {
  return (q || []).map(function (s) { return s.mssv; }).sort().join(',');
}

function nguoiNopLabel(s) {
  if (s.nguoiNop === 'nguoithan') {
    return 'Nộp hồ sơ: Người thân' + (s.thongTinNguoiNop ? ' (' + s.thongTinNguoiNop + ')' : '');
  }
  return 'Nộp hồ sơ: Bản thân';
}

function render() {
  var filter = document.getElementById('filter').value.trim().toLowerCase();
  var list = document.getElementById('list');
  var filtered = (currentQueue || []).filter(function (s) {
    if (!filter) return true;
    return (s.mssv + ' ' + s.hoten).toLowerCase().indexOf(filter) !== -1;
  });
  document.getElementById('count').textContent = currentQueue.length;
  document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';
  list.innerHTML = '';
  filtered.forEach(function (s) {
    var div = document.createElement('div');
    div.className = 'row';
    var ghichuId = 'gc_' + s.mssv;
    div.innerHTML =
      '<div class="info"><b>' + s.hoten + '</b><br>MSSV: ' + s.mssv +
      ' &middot; ' + (s.nganh || '') + '</div>' +
      '<div class="nguoinop">' + nguoiNopLabel(s) + '</div><br>' +
      '<textarea class="ghichu" id="' + ghichuId + '" rows="3" placeholder="Ghi chú (VD: trang phục chưa đạt, chụp lại lần 2...)"></textarea>';
    var btn = document.createElement('button');
    btn.className = 'act';
    btn.textContent = 'Đã chụp - trả biên nhận (hoàn tất)';
    btn.onclick = function () { completeStudent(s.mssv, ghichuId, btn); };
    div.appendChild(btn);
    list.appendChild(div);

    var ta = document.getElementById(ghichuId);
    ta.value = ghiChuStore[s.mssv] || '';
    ta.addEventListener('input', function () {
      ghiChuStore[s.mssv] = ta.value;
    });
  });
}

function showMsg(text, ok) {
  var msg = document.getElementById('msg');
  msg.style.display = 'block';
  msg.className = ok ? 'ok' : 'err';
  msg.textContent = text;
  setTimeout(function () { msg.style.display = 'none'; }, 4000);
}

function completeStudent(mssv, ghichuId, btn) {
  btn.disabled = true;
  btn.textContent = 'Đang xử lý...';
  var ghichu = document.getElementById(ghichuId).value.trim();
  var nhanvien = document.getElementById('nhanvien').value.trim();

  fetch(API_URL + "?action=quay3_complete", {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ mssv: mssv, ghichu: ghichu, nhanvien: nhanvien, key: API_KEY })
  })
    .then(function (response) { return response.json(); })
    .then(function (res) {
      showMsg(res.message, res.success);
      delete ghiChuStore[mssv];
      loadQueue(true);
    })
    .catch(function (err) {
      showMsg('Lỗi hệ thống: ' + err.message, false);
      btn.disabled = false;
      btn.textContent = 'Đã chụp - trả biên nhận (hoàn tất)';
    });
}

var lastKey = '';

function loadQueue(forceRender) {
  fetch(API_URL + "?action=quay3_getQueue&key=" + encodeURIComponent(API_KEY))
    .then(function (response) { return response.json(); })
    .then(function (res) {
      var newQueue = res || [];
      var newKey = queueKey(newQueue);
      currentQueue = newQueue;

      var list = document.getElementById('list');
      var dangGoGhiChu = document.activeElement &&
        list.contains(document.activeElement) &&
        document.activeElement.tagName === 'TEXTAREA';

      if (dangGoGhiChu && !forceRender) {
        // CTV đang gõ ghi chú -> chỉ cập nhật số đếm, KHÔNG rebuild danh sách
        // để tránh mất con trỏ. Không cập nhật lastKey, để lần load kế tiếp
        // (sau khi CTV rời khỏi ô) vẫn phát hiện được thay đổi và render lại.
        document.getElementById('count').textContent = currentQueue.length;
        return;
      }

      if (forceRender || newKey !== lastKey) {
        lastKey = newKey;
        render();
      } else {
        document.getElementById('count').textContent = currentQueue.length;
      }
    })
    .catch(function (err) {
      showMsg('Lỗi tải danh sách: ' + err.message, false);
    });
}

document.getElementById('filter').addEventListener('input', render);

loadQueue(true);
setInterval(function () { loadQueue(false); }, 5000);
</script>
